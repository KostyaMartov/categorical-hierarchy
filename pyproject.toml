[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "categorical-core"
version = "0.1.0"
description = "Когнитивный анализатор на основе теории категорий: иерархия абстракций, естественные преобразования, эндофункторы, монады и вероятностные процессы"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kostya Martov", email = "your.email@example.com" }
]
maintainers = [
    { name = "Kostya Martov", email = "your.email@example.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.0",
    "streamlit>=1.30.0",
    "pyvis>=0.3.0",
    "networkx>=2.8.0",
    "ollama>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/KostyaMartov/categorical-hierarchy"
Repository = "https://github.com/KostyaMartov/categorical-hierarchy"
Documentation = "https://github.com/KostyaMartov/categorical-hierarchy#readme"
"Bug Tracker" = "https://github.com/KostyaMartov/categorical-hierarchy/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "categorical_core"
strip = true
cargo-extra-args = ["--release"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88
